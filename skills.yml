# ============================================================
#  AstraXUltimate - định nghĩa Skill (xem README để biết đầy đủ tham số)
#
#  Mỗi skill có 4 giai đoạn: cast → charge → impact → after
#  Mỗi giai đoạn: duration (tick), lock-movement, actionbar, sounds, layers, pulse, shake
#  impact thêm: radius, combat-delay, combat (hồ sơ chiến đấu)
#  "extends: <skill khác>" = kế thừa toàn bộ rồi ghi đè các khóa riêng
#  Layer type: CIRCLE AURA SPIRAL ORBIT CONVERGE SHOCKWAVE SPHERE BEAM LIGHTNING DEBRIS CRATER SMOKE FLASH DOME LINE
#  Layer at: CASTER | TARGET | SKY | HAND     (trigger: LAND = chỉ bắt đầu khi Dragon Descent chạm đất)
# ============================================================

skills:

  # ==========================================================
  #  ☄ METEOR FALL
  # ==========================================================
  meteor-fall:
    type: METEOR_FALL
    display-name: '&6&l☄ METEOR FALL'
    description:
      - '&7Giơ tay triệu hồi thiên thạch khổng lồ từ bầu trời.'
      - '&7Va chạm: sóng xung kích, nổ bán kính 12, thiêu cháy.'
    cooldown: 45
    permission: astraxultimate.skill.meteor-fall
    sky-height: 30
    target: {mode: GROUND, range: 50, allow-miss: true}
    interrupt: {on-damage: false}
    params:
      fall-ticks: 16
      meteor-size: 1.8
      trail-length: 9
      slant: 10
      meteor:
        core: {particle: DUST, color: '#FF5A00', size: 2.4}
        glow: {particle: FLAME}
        trail: {particle: LARGE_SMOKE}
    cast:
      duration: 20
      actionbar: '&6&l☄ METEOR FALL &7- đang triệu hồi...'
      sounds:
        cast: {key: entity.blaze.shoot, volume: 1.2, pitch: 0.6}
        rune: {key: block.enchantment_table.use, volume: 1.0, pitch: 0.7, delay: 4}
        whoosh: {key: item.firecharge.use, volume: 1.0, pitch: 0.7, delay: 8}
      layers:
        hand-circle: {type: CIRCLE, at: CASTER, radius: 2.8, sides: 6, rings: 2, rotate: 8, grow: 8, particle: DUST, color: '#FF7A1A', size: 1.0, accent: {particle: FLAME}}
        hand-aura: {type: AURA, at: CASTER, radius: 1.2, height: 2.6, particle: FLAME}
        sky-circle: {type: CIRCLE, at: SKY, radius: 14, sides: 8, rings: 3, rotate: 4, grow: 14, particle: DUST, color: '#FF4500', size: 2.0, accent: {particle: DUST, color: '#FFD27A', size: 1.6}}
    charge:
      duration: 44
      lock-movement: true
      actionbar: '&c&l☄ THIÊN THẠCH ĐANG RƠI... &7(đừng đứng đó)'
      sounds:
        rise: {key: block.beacon.ambient, volume: 1.5, pitch: 0.5, pitch-end: 2.0, interval: 4}
        growl: {key: entity.ender_dragon.growl, volume: 1.2, pitch: 0.5}
        crackle: {key: block.fire.ambient, volume: 2.0, pitch: 0.8, interval: 10}
        whistle: {key: entity.ghast.shoot, volume: 2.0, pitch: 0.5, delay: 28}
      layers:
        hand-circle: {type: CIRCLE, at: CASTER, radius: 2.8, sides: 6, rings: 2, rotate: 10, particle: DUST, color: '#FF7A1A', size: 1.0, accent: {particle: FLAME}}
        sky-circle: {type: CIRCLE, at: SKY, radius: 14, sides: 8, rings: 3, rotate: 6, particle: DUST, color: '#FF4500', size: 2.0, accent: {particle: DUST, color: '#FFD27A', size: 1.6}}
        ground-warning: {type: CIRCLE, at: TARGET, radius: 12, sides: 5, rings: 2, rotate: -6, particle: DUST, color: '#FF2200', size: 1.2, accent: {particle: SMALL_FLAME}}
        embers: {type: CONVERGE, at: SKY, radius: 16, swirl: 3.0, flat: true, particle: FLAME}
        orbit: {type: ORBIT, at: CASTER, offset-y: 1.1, radius: 1.7, rings: 3, rotate: 14, particle: DUST, color: '#FFAA33', size: 0.9}
        warning-beam: {type: BEAM, at: TARGET, radius: 1.0, height: 12, delay: 20, particle: DUST, color: '#FF6600', size: 1.0, accent: {particle: FLAME}}
    impact:
      duration: 40
      radius: 12
      combat-delay: 0
      shake: {radius: 35, duration: 18, intensity: 2.8}
      combat:
        damage: 45
        falloff: 0.35
        crit: {chance: 0.2, multiplier: 1.6}
        true-damage: 0.1
        armor-penetration: 0.2
        knockback: {strength: 2.2, lift: 0.9, mode: RADIAL}
        burn: 160
        stun: 20
        execute: {threshold: 0.12, multiplier: 1.5}
        shield-break: 120
        max-targets: 30
      sounds:
        boom: {key: entity.generic.explode, volume: 4.0, pitch: 0.5}
        rock: {key: block.stone.break, volume: 3.0, pitch: 0.5, delay: 1}
        thunder: {key: entity.lightning_bolt.thunder, volume: 3.0, pitch: 0.6, delay: 2}
        rumble: {key: entity.iron_golem.death, volume: 2.0, pitch: 0.5, delay: 3}
        boom2: {key: entity.generic.explode, volume: 3.0, pitch: 0.8, delay: 5}
      layers:
        flash: {type: FLASH, at: TARGET, radius: 5, duration: 3, particle: DUST, color: '#FFF2D0', size: 2.0, accent: {particle: FLASH}}
        core: {type: SPHERE, at: TARGET, offset-y: 1, radius: 7, duration: 8, particle: DUST, color: '#FF8A00', size: 2.5}
        explosion: {type: SPHERE, at: TARGET, offset-y: 1, radius: 12, duration: 10, density: 1.4, particle: FLAME}
        shock1: {type: SHOCKWAVE, at: TARGET, radius: 12, rings: 3, duration: 12, particle: DUST, color: '#FFB060', size: 1.6}
        shock2: {type: SHOCKWAVE, at: TARGET, radius: 12, rings: 2, duration: 12, delay: 3, particle: LARGE_SMOKE}
        pillar: {type: BEAM, at: TARGET, radius: 3, height: 14, duration: 12, particle: FLAME, accent: {particle: DUST, color: '#FF9A30', size: 1.8}}
        debris-magma: {type: DEBRIS, at: TARGET, radius: 8, duration: 14, density: 1.5, particle: BLOCK, block: MAGMA_BLOCK}
        debris-stone: {type: DEBRIS, at: TARGET, radius: 8, duration: 14, delay: 2, particle: BLOCK, block: STONE}
        smoke: {type: SMOKE, at: TARGET, radius: 8, duration: 30, density: 1.2, particle: LARGE_SMOKE}
        crater: {type: CRATER, at: TARGET, radius: 10, duration: 36, delay: 2, strands: 8, particle: DUST, color: '#1A0E08', size: 1.8, accent: {particle: DUST, color: '#FF5A00', size: 1.0}}
    after:
      duration: 100
      sounds:
        fire: {key: block.fire.ambient, volume: 2.0, pitch: 0.8, interval: 15}
      layers:
        flames: {type: AURA, at: TARGET, radius: 10, height: 1.5, fade: true, particle: FLAME}
        embers: {type: DEBRIS, at: TARGET, radius: 8, fade: true, particle: LAVA}
        smoke: {type: SMOKE, at: TARGET, radius: 9, fade: true, particle: LARGE_SMOKE}
        crater-glow: {type: CRATER, at: TARGET, radius: 10, fade: true, interval: 8, strands: 8, particle: DUST, color: '#2A1008', size: 1.4, accent: {particle: DUST, color: '#FF4A00', size: 0.9}}
      pulse:
        interval: 10
        radius: 11
        at: TARGET
        combat: {damage: 5, burn: 60, indicators: false}

  # ==========================================================
  #  ⚡ THUNDER JUDGEMENT  (→ DIVINE THUNDER)
  # ==========================================================
  thunder-judgement:
