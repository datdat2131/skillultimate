      radius: 6
      combat-delay: 0
      shake: {radius: 35, duration: 14, intensity: 2.4}
      combat:
        damage: 70
        falloff: 0.25
        crit: {chance: 0.25, multiplier: 1.7}
        true-damage: 0.15
        armor-penetration: 0.25
        knockback: {strength: 1.8, lift: 0.8, mode: RADIAL}
        stun: 20
